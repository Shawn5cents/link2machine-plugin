name: plugin-ci

on:
  pull_request:

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, link2machine-plugin-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Inspect Grizzy tunnel restart failure safely
        if: github.head_ref == 'ops/diagnose-grizzy-nucbox'
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "collective-nucbox"

          echo "CONNECT_ERROR_SAFE_BEGIN"
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path("/tmp/grizzy-tunnel-connect.log")
          text=p.read_text(errors="replace") if p.exists() else "connect log missing"
          text=re.sub(r'https?://[^\s\"\']+', '<redacted-url>', text)
          text=re.sub(r'\bsk-[A-Za-z0-9_-]{8,}\b', '<redacted-secret>', text)
          text=re.sub(r'\b[A-Fa-f0-9]{32,}\b', '<redacted-hex>', text)
          text=re.sub(r'(?i)(token|secret|credential|api[_ -]?key)(\s*[:=]\s*)([^\s]+)', r'\1\2<redacted>', text)
          print(text[:5000])
          PY
          echo "CONNECT_ERROR_SAFE_END"

          echo "TUNNEL_PROFILE_FILES_BEGIN"
          find "$HOME/.config/tunnel-client" -maxdepth 3 -type f -printf '%m %s %p\n' 2>/dev/null | sed -n '1,120p'
          echo "TUNNEL_PROFILE_FILES_END"

          tunnel_bin="$(command -v tunnel-client || true)"
          if [[ -z "$tunnel_bin" && -x "$HOME/.local/bin/tunnel-client" ]]; then
            tunnel_bin="$HOME/.local/bin/tunnel-client"
          fi
          test -n "$tunnel_bin"

          echo "TUNNEL_TOP_HELP_BEGIN"
          timeout 8s "$tunnel_bin" --help 2>&1 | sed -n '1,160p' || true
          echo "TUNNEL_TOP_HELP_END"

          echo "DOCTOR_HELP_BEGIN"
          timeout 8s "$tunnel_bin" doctor --help 2>&1 | sed -n '1,140p' || true
          echo "DOCTOR_HELP_END"

      - name: Validate public package
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_endpoint = "https://mcp.nicholsai.com/mcp"
          plugin = json.loads(Path("plugin.json").read_text())
          mcp = json.loads(Path("mcp.json").read_text())
          server = json.loads(Path("server.json").read_text())
          claude = json.loads(Path(".claude-plugin/plugin.json").read_text())
          claude_mcp = json.loads(Path(".mcp.json").read_text())
          assert plugin["version"] == "0.7.6"
          assert plugin["repository"] == "https://github.com/Shawn5cents/link2machine-plugin"
          assert plugin["extensions"]["com.openai"]["publication"]["release_notes"]
          assert mcp["mcpServers"]["link2machine"]["url"] == expected_endpoint
          assert server["version"] == "0.7.6"
          assert server["remotes"][0]["url"] == expected_endpoint
          assert claude["version"] == "0.7.6"
          assert claude_mcp["mcpServers"]["link2machine"]["url"] == expected_endpoint
          print("Link2Machine public plugin verification: PASS")
          PY

      - name: Diff hygiene
        run: git diff --check
