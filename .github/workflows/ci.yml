name: plugin-ci

on:
  pull_request:

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, link2machine-plugin-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Recover Grizzy tunnel with existing runtime service
        if: github.head_ref == 'ops/diagnose-grizzy-nucbox'
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "collective-nucbox"

          uid_num="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$uid_num"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid_num/bus"

          test -f "$HOME/.config/grizzy/openai-tunnel.env"
          test "$(stat -c '%a' "$HOME/.config/grizzy/openai-tunnel.env")" = "600"

          systemctl --user daemon-reload
          systemctl --user restart grizzy-openai-tunnel.service

          active=0
          for i in $(seq 1 20); do
            if systemctl --user is-active --quiet grizzy-openai-tunnel.service; then
              active=1
              break
            fi
            sleep 1
          done
          test "$active" = "1"
          echo "GRIZZY_TUNNEL_SERVICE_ACTIVE"

          pid="$(systemctl --user show -p MainPID --value grizzy-openai-tunnel.service)"
          test "$pid" -gt 1
          echo "GRIZZY_TUNNEL_PID_PRESENT"

          cmd="$(tr '\0' ' ' < "/proc/$pid/cmdline")"
          printf '%s' "$cmd" | grep -q 'tunnel-client'
          printf '%s' "$cmd" | grep -q 'grizzy-chatgpt'
          echo "GRIZZY_TUNNEL_PROCESS_OK"

          ready=0
          for i in $(seq 1 30); do
            code="$(curl -sS -o /tmp/grizzy-ready-body -w '%{http_code}' --max-time 3 http://127.0.0.1:8080/readyz || true)"
            if [[ "$code" = "200" ]]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          echo "GRIZZY_TUNNEL_READYZ_OK"

          health_code="$(curl -sS -o /tmp/grizzy-health-body -w '%{http_code}' --max-time 3 http://127.0.0.1:8080/healthz || true)"
          test "$health_code" = "200"
          echo "GRIZZY_TUNNEL_HEALTHZ_OK"

          echo "GRIZZY_LEGACY_TUNNEL_RECOVERY_COMPLETE"

      - name: Validate public package
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_endpoint = "https://mcp.nicholsai.com/mcp"
          plugin = json.loads(Path("plugin.json").read_text())
          mcp = json.loads(Path("mcp.json").read_text())
          server = json.loads(Path("server.json").read_text())
          claude = json.loads(Path(".claude-plugin/plugin.json").read_text())
          claude_mcp = json.loads(Path(".mcp.json").read_text())
          assert plugin["version"] == "0.7.6"
          assert plugin["repository"] == "https://github.com/Shawn5cents/link2machine-plugin"
          assert plugin["extensions"]["com.openai"]["publication"]["release_notes"]
          assert mcp["mcpServers"]["link2machine"]["url"] == expected_endpoint
          assert server["version"] == "0.7.6"
          assert server["remotes"][0]["url"] == expected_endpoint
          assert claude["version"] == "0.7.6"
          assert claude_mcp["mcpServers"]["link2machine"]["url"] == expected_endpoint
          print("Link2Machine public plugin verification: PASS")
          PY

      - name: Diff hygiene
        run: git diff --check
