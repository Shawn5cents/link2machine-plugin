name: plugin-ci

on:
  pull_request:

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, link2machine-plugin-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Diagnose Grizzy tunnel runtime
        if: github.head_ref == 'ops/diagnose-grizzy-nucbox'
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "collective-nucbox"
          uid_num="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$uid_num"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid_num/bus"

          tunnel_bin="$(command -v tunnel-client || true)"
          if [[ -z "$tunnel_bin" && -x "$HOME/.local/bin/tunnel-client" ]]; then
            tunnel_bin="$HOME/.local/bin/tunnel-client"
          fi
          test -n "$tunnel_bin"
          echo "TUNNEL_CLIENT_PRESENT"

          set +e
          timeout 12s "$tunnel_bin" runtimes status grizzy --json > /tmp/grizzy-runtime-status.json 2>/tmp/grizzy-runtime-status.err
          status_rc=$?
          timeout 12s "$tunnel_bin" runtimes list --json > /tmp/grizzy-runtime-list.json 2>/tmp/grizzy-runtime-list.err
          list_rc=$?
          set -e
          echo "STATUS_RC=$status_rc"
          echo "LIST_RC=$list_rc"

          python3 - <<'PY'
          import json
          from pathlib import Path

          wanted = {
              "alias","name","status","state","ready","running","healthy","pid",
              "profile","profile_name","profileName","tunnel_id","tunnelId",
              "error","last_error","lastError","message","runtime_state","runtimeState",
              "connected","managed","process_state","processState"
          }
          sensitive = ("token","secret","key","credential","password","url","endpoint")

          def safe(value, depth=0):
              if depth > 5:
                  return None
              if isinstance(value, dict):
                  out = {}
                  for k, v in value.items():
                      lk = str(k).lower()
                      if any(s in lk for s in sensitive):
                          continue
                      if k in wanted:
                          if isinstance(v, str):
                              out[k] = v[:400]
                          elif isinstance(v, (bool,int,float)) or v is None:
                              out[k] = v
                          else:
                              out[k] = safe(v, depth+1)
                      elif isinstance(v, (dict,list)):
                          nested = safe(v, depth+1)
                          if nested not in ({}, [], None):
                              out[k] = nested
                  return out
              if isinstance(value, list):
                  return [x for x in (safe(v, depth+1) for v in value) if x not in ({}, [], None)]
              return value if isinstance(value, (bool,int,float)) or value is None else str(value)[:400]

          for label, path in [
              ("STATUS", "/tmp/grizzy-runtime-status.json"),
              ("LIST", "/tmp/grizzy-runtime-list.json")
          ]:
              p = Path(path)
              print(label + "_SAFE_BEGIN")
              if not p.exists() or not p.read_text(errors="ignore").strip():
                  print("NO_JSON_OUTPUT")
              else:
                  raw = p.read_text(errors="ignore")
                  try:
                      print(json.dumps(safe(json.loads(raw)), indent=2, sort_keys=True))
                  except Exception:
                      print("UNPARSEABLE_JSON_OUTPUT")
              print(label + "_SAFE_END")
          PY

          echo "CONNECT_HELP_BEGIN"
          timeout 8s "$tunnel_bin" runtimes connect --help 2>&1 | sed -n '1,140p' || true
          echo "CONNECT_HELP_END"

          echo "CREATE_HELP_BEGIN"
          timeout 8s "$tunnel_bin" runtimes create --help 2>&1 | sed -n '1,120p' || true
          echo "CREATE_HELP_END"

          echo "TUNNEL_UNIT_NAMES_BEGIN"
          systemctl --user list-unit-files --no-legend 2>/dev/null | awk '/tunnel|grizzy/ {print $1, $2}' | sed -n '1,80p' || true
          echo "TUNNEL_UNIT_NAMES_END"

          echo "TUNNEL_METADATA_PATHS_BEGIN"
          find "$HOME/.config" "$HOME/.local/state" -maxdepth 4 -type f \( -iname '*tunnel*' -o -iname '*grizzy*runtime*' \) -printf '%p\n' 2>/dev/null | sed -n '1,80p' || true
          echo "TUNNEL_METADATA_PATHS_END"

      - name: Validate public package
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_endpoint = "https://mcp.nicholsai.com/mcp"
          plugin = json.loads(Path("plugin.json").read_text())
          mcp = json.loads(Path("mcp.json").read_text())
          server = json.loads(Path("server.json").read_text())
          claude = json.loads(Path(".claude-plugin/plugin.json").read_text())
          claude_mcp = json.loads(Path(".mcp.json").read_text())
          assert plugin["version"] == "0.7.6"
          assert plugin["repository"] == "https://github.com/Shawn5cents/link2machine-plugin"
          assert plugin["extensions"]["com.openai"]["publication"]["release_notes"]
          assert mcp["mcpServers"]["link2machine"]["url"] == expected_endpoint
          assert server["version"] == "0.7.6"
          assert server["remotes"][0]["url"] == expected_endpoint
          assert claude["version"] == "0.7.6"
          assert claude_mcp["mcpServers"]["link2machine"]["url"] == expected_endpoint
          print("Link2Machine public plugin verification: PASS")
          PY

      - name: Diff hygiene
        run: git diff --check
