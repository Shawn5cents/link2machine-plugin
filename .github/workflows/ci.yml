name: plugin-ci

on:
  pull_request:

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, link2machine-plugin-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check repaired Grizzy tunnel prerequisites
        if: github.head_ref == 'ops/diagnose-grizzy-nucbox'
        shell: bash
        run: |
          set -u
          test "$(hostname)" = "collective-nucbox" || { echo HOST_FAIL; exit 1; }
          echo HOST_OK

          profile="$HOME/.config/tunnel-client/grizzy-chatgpt.yaml"
          envfile="$HOME/.config/grizzy/openai-tunnel.env"
          [[ -f "$profile" ]] && echo PROFILE_PRESENT || echo PROFILE_MISSING
          [[ -f "$envfile" ]] && echo ENVFILE_PRESENT || echo ENVFILE_MISSING
          [[ -f "$envfile" ]] && echo "ENVFILE_MODE=$(stat -c '%a' "$envfile")"

          python3 - <<'PY'
          from pathlib import Path
          p=Path.home()/".config/tunnel-client/grizzy-chatgpt.yaml"
          if not p.exists():
              print("PROFILE_CHECK=MISSING")
          else:
              s=p.read_text()
              print("PROFILE_USES_ENV_REF="+str("env:CONTROL_PLANE_API_KEY" in s))
              print("PROFILE_USES_STALE_DOWNLOAD_REF="+str("file:/home/shawn5cents/Downloads/openai-api-key.txt" in s))
          PY

          if [[ -f "$envfile" ]]; then
            set -a
            source "$envfile"
            set +a
            [[ -n "${CONTROL_PLANE_API_KEY:-}" ]] && echo RUNTIME_KEY_PRESENT || echo RUNTIME_KEY_MISSING
            [[ -n "${CONTROL_PLANE_TUNNEL_ID:-}" ]] && echo TUNNEL_ID_PRESENT || echo TUNNEL_ID_MISSING
          fi

          tunnel_bin="$(command -v tunnel-client || true)"
          [[ -z "$tunnel_bin" && -x "$HOME/.local/bin/tunnel-client" ]] && tunnel_bin="$HOME/.local/bin/tunnel-client"
          [[ -n "$tunnel_bin" ]] && echo TUNNEL_CLIENT_PRESENT || echo TUNNEL_CLIENT_MISSING

          if [[ -n "$tunnel_bin" && -f "$envfile" ]]; then
            "$tunnel_bin" doctor --profile grizzy-chatgpt >/tmp/grizzy-doctor.out 2>/tmp/grizzy-doctor.err
            rc=$?
            echo "DOCTOR_RC=$rc"
            if [[ "$rc" -ne 0 ]]; then
              python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path("/tmp/grizzy-doctor.err").read_text(errors="replace") if Path("/tmp/grizzy-doctor.err").exists() else ""
          text=re.sub(r'https?://[^\s\"\x27]+','<redacted-url>',text)
          text=re.sub(r'\bsk-[A-Za-z0-9_-]{8,}\b','<redacted-secret>',text)
          text=re.sub(r'\b[A-Fa-f0-9]{32,}\b','<redacted-hex>',text)
          print(text[:3000])
          PY
            fi
          fi

          exit 0

      - name: Validate public package
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_endpoint = "https://mcp.nicholsai.com/mcp"
          plugin = json.loads(Path("plugin.json").read_text())
          mcp = json.loads(Path("mcp.json").read_text())
          server = json.loads(Path("server.json").read_text())
          claude = json.loads(Path(".claude-plugin/plugin.json").read_text())
          claude_mcp = json.loads(Path(".mcp.json").read_text())
          assert plugin["version"] == "0.7.6"
          assert mcp["mcpServers"]["link2machine"]["url"] == expected_endpoint
          assert server["remotes"][0]["url"] == expected_endpoint
          assert claude_mcp["mcpServers"]["link2machine"]["url"] == expected_endpoint
          print("Link2Machine public plugin verification: PASS")
          PY

      - name: Diff hygiene
        run: git diff --check
