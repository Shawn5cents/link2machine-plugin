name: plugin-ci

on:
  pull_request:

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, link2machine-plugin-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Repair and verify Grizzy Secure MCP Tunnel
        if: github.head_ref == 'ops/diagnose-grizzy-nucbox'
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "collective-nucbox"

          uid_num="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$uid_num"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid_num/bus"

          profile="$HOME/.config/tunnel-client/grizzy-chatgpt.yaml"
          envfile="$HOME/.config/grizzy/openai-tunnel.env"
          test -f "$profile"
          test -f "$envfile"
          test "$(stat -c '%a' "$envfile")" = "600"

          python3 - <<'PY'
          from pathlib import Path
          p=Path.home()/".config/tunnel-client/grizzy-chatgpt.yaml"
          s=p.read_text()
          stale="file:/home/shawn5cents/Downloads/openai-api-key.txt"
          desired="env:CONTROL_PLANE_API_KEY"
          if stale in s:
              s=s.replace(stale, desired)
              p.write_text(s)
          elif desired not in s:
              raise SystemExit("unexpected control_plane.api_key reference")
          p.chmod(0o600)
          print("GRIZZY_TUNNEL_PROFILE_KEY_REFERENCE_OK")
          PY

          set -a
          source "$envfile"
          set +a
          test -n "${CONTROL_PLANE_API_KEY:-}"
          test -n "${CONTROL_PLANE_TUNNEL_ID:-}"
          echo "GRIZZY_TUNNEL_RUNTIME_ENV_OK"

          tunnel_bin="$(command -v tunnel-client || true)"
          if [[ -z "$tunnel_bin" && -x "$HOME/.local/bin/tunnel-client" ]]; then
            tunnel_bin="$HOME/.local/bin/tunnel-client"
          fi
          test -n "$tunnel_bin"

          "$tunnel_bin" doctor --profile grizzy-chatgpt >/tmp/grizzy-doctor.out 2>/tmp/grizzy-doctor.err
          echo "GRIZZY_TUNNEL_DOCTOR_OK"

          systemctl --user reset-failed grizzy-openai-tunnel.service || true
          systemctl --user restart grizzy-openai-tunnel.service

          active=0
          for i in $(seq 1 20); do
            if systemctl --user is-active --quiet grizzy-openai-tunnel.service; then
              active=1
              break
            fi
            sleep 1
          done
          test "$active" = "1"
          echo "GRIZZY_TUNNEL_SERVICE_ACTIVE"

          health_file="$HOME/.local/state/tunnel-client/health/grizzy.url"
          ready=0
          for i in $(seq 1 30); do
            if [[ -s "$health_file" ]]; then
              base="$(cat "$health_file")"
              code="$(curl -sS -o /tmp/grizzy-ready-body -w '%{http_code}' --max-time 3 "$base/readyz" || true)"
              if [[ "$code" = "200" ]]; then
                ready=1
                break
              fi
            fi
            sleep 2
          done
          test "$ready" = "1"
          echo "GRIZZY_TUNNEL_READYZ_OK"

          base="$(cat "$health_file")"
          health_code="$(curl -sS -o /tmp/grizzy-health-body -w '%{http_code}' --max-time 3 "$base/healthz" || true)"
          test "$health_code" = "200"
          echo "GRIZZY_TUNNEL_HEALTHZ_OK"

          pid="$(systemctl --user show -p MainPID --value grizzy-openai-tunnel.service)"
          test "$pid" -gt 1
          echo "GRIZZY_TUNNEL_PROCESS_OK"

          echo "GRIZZY_TUNNEL_RECOVERY_COMPLETE"

      - name: Validate public package
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_endpoint = "https://mcp.nicholsai.com/mcp"
          plugin = json.loads(Path("plugin.json").read_text())
          mcp = json.loads(Path("mcp.json").read_text())
          server = json.loads(Path("server.json").read_text())
          claude = json.loads(Path(".claude-plugin/plugin.json").read_text())
          claude_mcp = json.loads(Path(".mcp.json").read_text())
          assert plugin["version"] == "0.7.6"
          assert plugin["repository"] == "https://github.com/Shawn5cents/link2machine-plugin"
          assert plugin["extensions"]["com.openai"]["publication"]["release_notes"]
          assert mcp["mcpServers"]["link2machine"]["url"] == expected_endpoint
          assert server["version"] == "0.7.6"
          assert server["remotes"][0]["url"] == expected_endpoint
          assert claude["version"] == "0.7.6"
          assert claude_mcp["mcpServers"]["link2machine"]["url"] == expected_endpoint
          print("Link2Machine public plugin verification: PASS")
          PY

      - name: Diff hygiene
        run: git diff --check
