name: plugin-ci

on:
  pull_request:

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, link2machine-plugin-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Locate existing Grizzy tunnel credential safely
        if: github.head_ref == 'ops/diagnose-grizzy-nucbox'
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "collective-nucbox"

          echo "CANDIDATE_FILES_BEGIN"
          find "$HOME/.config" "$HOME/.local/share" "$HOME/.local/state" "$HOME/Documents" "$HOME/Downloads"             -maxdepth 5 -type f             \( -iname '*openai*key*' -o -iname '*runtime*key*' -o -iname '*tunnel*.env' -o -iname '*openai*.env' -o -iname '*api-key*' \)             -printf '%m %s %p\n' 2>/dev/null | sed -n '1,160p'
          echo "CANDIDATE_FILES_END"

          echo "REFERENCE_FILES_BEGIN"
          python3 - <<'PY'
          from pathlib import Path
          roots=[Path.home()/".config", Path.home()/".local/share", Path.home()/".local/state"]
          needles=("OPENAI_ADMIN_KEY","CONTROL_PLANE_API_KEY","GRIZZY_OPENAI_RUNTIME_KEY","openai-api-key.txt","runtime-api-key")
          found=[]
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob("*"):
                  if not p.is_file(): continue
                  try:
                      if p.stat().st_size > 1024*1024: continue
                      text=p.read_text(errors="ignore")
                  except Exception:
                      continue
                  hits=[n for n in needles if n in text]
                  if hits:
                      found.append((str(p), hits, p.stat().st_mode & 0o777, p.stat().st_size))
          for path,hits,mode,size in found[:120]:
              print(f"{mode:o} {size} {path} refs={','.join(hits)}")
          PY
          echo "REFERENCE_FILES_END"

          echo "SECRET_SHAPE_CANDIDATES_BEGIN"
          python3 - <<'PY'
          import re
          from pathlib import Path
          roots=[Path.home()/".config", Path.home()/".local/share", Path.home()/".local/state", Path.home()/"Documents", Path.home()/"Downloads"]
          seen=set()
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob("*"):
                  if not p.is_file() or str(p) in seen: continue
                  seen.add(str(p))
                  try:
                      st=p.stat()
                      if st.st_size==0 or st.st_size>256*1024: continue
                      text=p.read_text(errors="ignore")
                  except Exception:
                      continue
                  # Report only location/metadata when a file appears to contain an OpenAI-style key.
                  if re.search(r'\bsk-[A-Za-z0-9_-]{20,}\b', text):
                      print(f"{st.st_mode & 0o777:o} {st.st_size} {p}")
          PY
          echo "SECRET_SHAPE_CANDIDATES_END"

      - name: Validate public package
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_endpoint = "https://mcp.nicholsai.com/mcp"
          plugin = json.loads(Path("plugin.json").read_text())
          mcp = json.loads(Path("mcp.json").read_text())
          server = json.loads(Path("server.json").read_text())
          claude_mcp = json.loads(Path(".mcp.json").read_text())
          assert plugin["version"] == "0.7.6"
          assert mcp["mcpServers"]["link2machine"]["url"] == expected_endpoint
          assert server["remotes"][0]["url"] == expected_endpoint
          assert claude_mcp["mcpServers"]["link2machine"]["url"] == expected_endpoint
          print("Link2Machine public plugin verification: PASS")
          PY

      - name: Diff hygiene
        run: git diff --check
