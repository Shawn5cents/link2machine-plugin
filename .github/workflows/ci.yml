name: plugin-ci

on:
  pull_request:

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, link2machine-plugin-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Inspect Grizzy tunnel service failure safely
        if: github.head_ref == 'ops/diagnose-grizzy-nucbox'
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "collective-nucbox"
          uid_num="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$uid_num"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid_num/bus"

          echo "SERVICE_STATE_BEGIN"
          systemctl --user show grizzy-openai-tunnel.service             -p LoadState -p ActiveState -p SubState -p Result -p MainPID -p ExecMainCode -p ExecMainStatus -p NRestarts
          echo "SERVICE_STATE_END"

          echo "PROFILE_SAFE_BEGIN"
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path.home()/".config/tunnel-client/grizzy-chatgpt.yaml"
          if not p.exists():
              print("PROFILE_MISSING")
          else:
              for raw in p.read_text(errors="replace").splitlines():
                  line=raw.rstrip()
                  if not line.strip() or line.lstrip().startswith("#"):
                      continue
                  if ":" not in line:
                      continue
                  indent=len(line)-len(line.lstrip())
                  key=line.strip().split(":",1)[0]
                  low=key.lower()
                  if any(x in low for x in ("key","token","secret","password","credential")):
                      val="<redacted>"
                  else:
                      value=line.split(":",1)[1].strip()
                      if value:
                          if re.search(r'https?://', value):
                              val="<configured-url>"
                          elif len(value)>80:
                              val="<configured>"
                          else:
                              val=value
                      else:
                          val=""
                  print(" "*indent + key + (": "+val if val else ":"))
          PY
          echo "PROFILE_SAFE_END"

          echo "JOURNAL_SAFE_BEGIN"
          journalctl --user -u grizzy-openai-tunnel.service -n 80 --no-pager -o cat 2>/dev/null |           python3 -c 'import re,sys
          text=sys.stdin.read()
          text=re.sub(r"https?://[^\\s\\\"\\x27]+","<redacted-url>",text)
          text=re.sub(r"\\bsk-[A-Za-z0-9_-]{8,}\\b","<redacted-secret>",text)
          text=re.sub(r"\\b[A-Fa-f0-9]{32,}\\b","<redacted-hex>",text)
          text=re.sub(r"(?i)(token|secret|credential|api[_ -]?key)(\\s*[:=]\\s*)([^\\s]+)",r"\\1\\2<redacted>",text)
          print(text[-12000:])'
          echo "JOURNAL_SAFE_END"

          echo "PORTS_BEGIN"
          ss -ltnp 2>/dev/null | awk '$4 ~ /:8080$|:8791$/ {print $1,$4,$6}' | sed -n '1,40p'
          echo "PORTS_END"

      - name: Validate public package
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_endpoint = "https://mcp.nicholsai.com/mcp"
          plugin = json.loads(Path("plugin.json").read_text())
          mcp = json.loads(Path("mcp.json").read_text())
          server = json.loads(Path("server.json").read_text())
          claude = json.loads(Path(".claude-plugin/plugin.json").read_text())
          claude_mcp = json.loads(Path(".mcp.json").read_text())
          assert plugin["version"] == "0.7.6"
          assert plugin["repository"] == "https://github.com/Shawn5cents/link2machine-plugin"
          assert plugin["extensions"]["com.openai"]["publication"]["release_notes"]
          assert mcp["mcpServers"]["link2machine"]["url"] == expected_endpoint
          assert server["version"] == "0.7.6"
          assert server["remotes"][0]["url"] == expected_endpoint
          assert claude["version"] == "0.7.6"
          assert claude_mcp["mcpServers"]["link2machine"]["url"] == expected_endpoint
          print("Link2Machine public plugin verification: PASS")
          PY

      - name: Diff hygiene
        run: git diff --check
