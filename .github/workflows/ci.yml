name: plugin-ci

on:
  pull_request:

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, link2machine-plugin-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Restart existing Grizzy Secure MCP Tunnel runtime
        if: github.head_ref == 'ops/diagnose-grizzy-nucbox'
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "collective-nucbox"

          uid_num="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$uid_num"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid_num/bus"

          set -a
          source "$HOME/.config/grizzy/operator.env"
          set +a
          test -n "${GRIZZY_MCP_TOKEN:-}"
          test "${GRIZZY_MCP_SHELL:-0}" = "1"

          tunnel_bin="$(command -v tunnel-client || true)"
          if [[ -z "$tunnel_bin" && -x "$HOME/.local/bin/tunnel-client" ]]; then
            tunnel_bin="$HOME/.local/bin/tunnel-client"
          fi
          test -n "$tunnel_bin"

          mcp_url="http://127.0.0.1:${GRIZZY_MCP_PORT:-8791}/mcp/${GRIZZY_MCP_TOKEN}"
          set +e
          timeout 35s "$tunnel_bin" runtimes connect             --alias grizzy             --admin-profile default             --profile grizzy-chatgpt             --profile-dir "$HOME/.config/tunnel-client"             --organization-id org-TfAwjE3dDUcoPnqwyOSmPnC8             --mcp-server-url "$mcp_url"             >/tmp/grizzy-tunnel-connect.log 2>&1
          connect_rc=$?
          set -e
          echo "GRIZZY_TUNNEL_CONNECT_RC=$connect_rc"

          ready=0
          for i in $(seq 1 20); do
            status_json="$(timeout 10s "$tunnel_bin" runtimes status grizzy --json 2>/dev/null || true)"
            if STATUS_JSON="$status_json" python3 - <<'PY'
          import json, os, sys
          try:
              data=json.loads(os.environ.get("STATUS_JSON","{}"))
          except Exception:
              sys.exit(1)
          sys.exit(0 if data.get("ready") is True and data.get("runtime_state") == "running" else 1)
          PY
            then
              ready=1
              break
            fi
            sleep 3
          done

          if [[ "$ready" != "1" ]]; then
            echo "GRIZZY_TUNNEL_RESTART_FAILED"
            status_json="$(timeout 10s "$tunnel_bin" runtimes status grizzy --json 2>/dev/null || true)"
            STATUS_JSON="$status_json" python3 - <<'PY'
          import json, os
          try:
              d=json.loads(os.environ.get("STATUS_JSON","{}"))
          except Exception:
              print("STATUS_UNAVAILABLE")
              raise SystemExit
          local=d.get("local") or {}
          print("alias="+str(d.get("alias","")))
          print("ready="+str(d.get("ready")))
          print("runtime_state="+str(d.get("runtime_state","")))
          print("healthy="+str(d.get("healthy")))
          print("issues="+repr(local.get("issues") or []))
          print("tmux_running="+str((local.get("tmux") or {}).get("running")))
          PY
            exit 1
          fi

          echo "GRIZZY_TUNNEL_READY"
          echo "GRIZZY_TUNNEL_RUNTIME_RUNNING"
          echo "GRIZZY_TUNNEL_RECOVERY_COMPLETE"

      - name: Validate public package
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_endpoint = "https://mcp.nicholsai.com/mcp"
          plugin = json.loads(Path("plugin.json").read_text())
          mcp = json.loads(Path("mcp.json").read_text())
          server = json.loads(Path("server.json").read_text())
          claude = json.loads(Path(".claude-plugin/plugin.json").read_text())
          claude_mcp = json.loads(Path(".mcp.json").read_text())
          assert plugin["version"] == "0.7.6"
          assert plugin["repository"] == "https://github.com/Shawn5cents/link2machine-plugin"
          assert plugin["extensions"]["com.openai"]["publication"]["release_notes"]
          assert mcp["mcpServers"]["link2machine"]["url"] == expected_endpoint
          assert server["version"] == "0.7.6"
          assert server["remotes"][0]["url"] == expected_endpoint
          assert claude["version"] == "0.7.6"
          assert claude_mcp["mcpServers"]["link2machine"]["url"] == expected_endpoint
          print("Link2Machine public plugin verification: PASS")
          PY

      - name: Diff hygiene
        run: git diff --check
